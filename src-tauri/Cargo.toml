[package]
name = "rollcasters-desktop"
version = "0.1.0"
description = "Rollcasters desktop game shell"
authors = ["Rollcasters"]
edition = "2024"

[lib]
name = "rollcasters_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-localhost = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
